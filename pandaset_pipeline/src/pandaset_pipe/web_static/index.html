<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PandaSet WebGL Viewer</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="main">
  <div id="view3d-wrap"><canvas id="view3d"></canvas></div>
  <div id="side">
    <div id="camgrid"></div>
    <div id="map"></div>
    <div id="controls">
      <button id="btnPlay">Stop</button>
      <div id="speedo">--.- km/h</div>
      <label><input type="checkbox" id="chkLidar" checked> LiDAR proj</label>
      <label><input type="checkbox" id="chkBoxes" checked> Boxes proj</label>
      <select id="colorMode">
        <option value="height" selected>height</option>
        <option value="intensity">intensity</option>
        <option value="semseg">semseg</option>
      </select>
      <select id="sweepSel"></select>
      <span id="frameLbl">f 0/0</span>
      <input type="range" id="slider" min="0" max="0" value="0">
    </div>
  </div>
</div>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/vendor/OrbitControls.js"></script>
<script src="/static/vendor/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
